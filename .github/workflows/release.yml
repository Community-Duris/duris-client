name: Release

# Pushing a tag like `v1.2` builds the package from that tag and publishes a
# GitHub Release with the .mpackage attached. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (semver)."
            exit 1
          fi
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match VERSION ($VERSION). Bump VERSION, rebuild, commit, then re-tag."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install luac (Lua 5.1, matching Mudlet)
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Build package
        run: |
          set -e
          python3 build.py --check
          mkdir -p dist
          python3 build.py -o dist/duris-client.mpackage
          cp dist/duris-client.mpackage "dist/duris-client-${VERSION}.mpackage"
          (cd dist && sha256sum *.mpackage > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -e
          # Take the section under "## <version>" up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v || $2 == "[" v "]"); next }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION; using placeholder." >&2
            echo "Release $VERSION." > dist/notes.md
          fi
          {
            echo
            echo "## Install"
            echo
            echo "Download \`duris-client.mpackage\` below, then in Mudlet open **Package Manager** (\`Alt+O\`), choose **Install New Package**, and select the file. Requires Mudlet 4.19.1+ with GMCP enabled."
          } >> dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Duris Client $VERSION" \
            --notes-file dist/notes.md \
            --verify-tag \
            dist/duris-client.mpackage \
            "dist/duris-client-${VERSION}.mpackage" \
            dist/SHA256SUMS.txt
